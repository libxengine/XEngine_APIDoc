<H1>函数</H1>
<P>
DataBase_MySQL_FreeResult
</P>
<H1>
功能

</H1>
<P>释放查询的结果集</P>
<H1 >
 语法</H1>
<P >
  bool DataBase_MySQL_FreeResult(XCHAR** pptszResult, 
int  nListCount)</P>

<P></P> 
 <P>             </P>
<H1>参数 </H1>
<P>&nbsp;参数.一：pptszResult<BR>&nbsp; In/Out：In<BR>&nbsp; 
类型：二级指针<BR>&nbsp; 可空：N<BR>&nbsp; 意思：要释放的内存<BR>&nbsp;参数.二：nListCount<BR>&nbsp; 
In/Out：In<BR>&nbsp; 类型：整数型<BR>&nbsp; 可空：N<BR>&nbsp; 意思：内存列表个数,row*col</P>
<P></P>
<H1>返回值</H1>
<P>类型：逻辑型<BR>意思：是否成功</P>
<H1>备注</H1>
<P>同BaseLib_Memory_Free函数</P>
